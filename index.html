<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OVERHEAT</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #09090b; overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
      touch-action: none;
    }
    canvas { display: block; width: 100%; height: 100%; }
    
    /* Green Neon Screen Frame for Glitch x2 Mode */
    #glitch-frame {
      position: fixed; inset: 0; pointer-events: none; z-index: 8;
      border: 4px solid #22c55e;
      box-shadow: inset 0 0 28px rgba(34, 197, 94, 0.45);
      opacity: 0; transition: opacity 0.2s ease;
    }
    #glitch-frame.active { opacity: 1; }

    /* Intro Top Bar: Bank Points & Wardrobe Button */
    #intro-top-bar {
      position: absolute; top: 18px; left: 16px; right: 16px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 15; transition: opacity 0.3s ease;
    }
    #bank-box {
      background: rgba(20, 20, 30, 0.85);
      border: 1px solid #2e2e42;
      padding: 6px 12px; border-radius: 8px;
      color: #00f0ff; font-size: 12px; font-weight: bold; letter-spacing: 1px;
    }
    #wardrobe-btn {
      background: rgba(168, 85, 247, 0.2);
      border: 1.5px solid #a855f7;
      color: #fff; font-family: inherit; font-size: 12px; font-weight: bold;
      letter-spacing: 1.5px; padding: 7px 14px; border-radius: 8px;
      cursor: pointer; pointer-events: auto;
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.35);
    }
    #wardrobe-btn:active { transform: scale(0.95); }

    /* Wardrobe Modal Panel */
    #wardrobe-panel {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(12, 12, 18, 0.96);
      border-top: 2px solid #a855f7;
      border-radius: 18px 18px 0 0;
      padding: 16px 16px 26px;
      z-index: 25;
      transform: translateY(105%);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      max-height: 54%;
      display: flex; flex-direction: column;
    }
    #wardrobe-panel.open { transform: translateY(0); }
    #wardrobe-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #252536;
    }
    #wardrobe-header span {
      color: #fff; font-weight: bold; font-size: 14px; letter-spacing: 2px;
    }
    #close-wardrobe {
      background: #222; border: 1px solid #444; color: #fff;
      font-family: inherit; font-size: 11px; padding: 5px 10px; border-radius: 6px;
      cursor: pointer;
    }
    #wardrobe-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      overflow-y: auto; padding-right: 2px;
    }
    .gear-box {
      background: #161622; border: 1.5px solid #2a2a3d;
      border-radius: 10px; padding: 10px 6px; text-align: center;
      cursor: pointer; transition: border-color 0.2s, transform 0.1s;
    }
    .gear-box:active { transform: scale(0.96); }
    .gear-box.equipped {
      border-color: #00f0ff;
      background: rgba(0, 240, 255, 0.1);
    }
    .gear-box.locked { opacity: 0.7; }
    .gear-cat {
      font-size: 8px; color: #888; letter-spacing: 1px; text-transform: uppercase;
    }
    .gear-name {
      font-size: 11px; color: #fff; font-weight: bold; margin: 4px 0;
    }
    .gear-status {
      font-size: 10px; font-weight: bold; color: #a855f7;
    }
    .gear-box.equipped .gear-status { color: #00f0ff; }

    /* Top-Right Compact Level Indicator */
    #level-corner {
      position: absolute; top: 18px; right: 16px;
      text-align: right; pointer-events: none; z-index: 10;
      transition: transform 0.25s ease, opacity 0.3s ease;
    }
    #level-corner.level-up-pop { transform: scale(1.22); }
    #level-text {
      font-size: 13px; letter-spacing: 1.5px; font-weight: bold; color: #00f0ff;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
    }
    #goal-text {
      font-size: 11px; color: #aaa; letter-spacing: 1px; margin-top: 2px; font-weight: bold;
    }
    #goal-bar-container {
      width: 95px; height: 5px; background: #181824; margin-left: auto; margin-top: 4px;
      border-radius: 3px; overflow: hidden; border: 1px solid #2e2e42;
    }
    #goal-bar {
      width: 0%; height: 100%; background: #00f0ff;
      transition: width 0.1s linear;
    }

    /* Top-Left Active Perk Indicator */
    #status-corner {
      position: absolute; top: 18px; left: 16px;
      text-align: left; pointer-events: none; z-index: 10;
      font-size: 11px; font-weight: bold; letter-spacing: 1px;
    }
    .badge {
      display: block; margin-bottom: 4px; padding: 4px 8px;
      border-radius: 4px; background: rgba(15, 15, 22, 0.85);
    }

    /* Center UI */
    #ui {
      position: absolute; top: 20px; left: 0; width: 100%;
      text-align: center; pointer-events: none; color: #fff;
      transition: opacity 0.3s ease;
    }
    #ego-title {
      font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase;
      color: #888; font-weight: bold; margin-bottom: 2px;
    }
    #score { font-size: 44px; font-weight: 900; margin: 0; }
    #mult-badge {
      font-size: 12px; color: #00f0ff; font-weight: bold; letter-spacing: 1px;
      height: 16px;
    }
    #heat-label {
      font-size: 9px; letter-spacing: 2px; color: #777; margin: 2px 0 3px;
    }
    #heat-bar-container {
      width: 54%; height: 9px; background: #222; margin: 0 auto;
      border-radius: 5px; overflow: hidden; border: 1px solid #444;
    }
    #heat-bar {
      width: 0%; height: 100%; background: linear-gradient(90deg, #00f0ff, #a855f7, #ff0055);
    }

    /* Game Title during Intro */
    #intro-brand {
      position: absolute; top: 13%; width: 100%; text-align: center;
      pointer-events: none; transition: opacity 0.3s ease, transform 0.3s ease;
    }
    #intro-brand h1 {
      margin: 0; font-size: 38px; letter-spacing: 8px; color: #ffffff;
      text-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
    }
    #intro-brand p {
      margin: 6px 0 0; font-size: 11px; letter-spacing: 3px; color: #00f0ff;
    }

    /* Start Overlay & Mini Item Legend */
    #hint-box {
      position: absolute; bottom: 14%; width: 100%; text-align: center;
      pointer-events: none; padding: 0 20px; transition: opacity 0.2s;
    }
    #hint {
      color: #00f0ff; font-size: 15px; letter-spacing: 2px; font-weight: bold;
      animation: blink 1s infinite; margin-bottom: 14px;
    }
    #legend {
      display: inline-flex; gap: 14px; background: rgba(20, 20, 30, 0.75);
      padding: 8px 14px; border-radius: 20px; border: 1px solid #2a2a3d;
      font-size: 10px; color: #ccc; letter-spacing: 0.5px;
    }
    .leg-item { display: flex; align-items: center; gap: 5px; }
    .dot-cyan { width: 8px; height: 8px; border-radius: 50%; background: #00f0ff; display: inline-block; }
    .dot-white { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid #fff; display: inline-block; }
    .dot-green { width: 8px; height: 8px; background: #22c55e; transform: rotate(45deg); display: inline-block; }

    #banner {
      position: absolute; top: 42%; left: 0; width: 100%; text-align: center;
      pointer-events: none; opacity: 0; transform: scale(0.8);
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 20;
    }
    #banner.show { opacity: 1; transform: scale(1); }
    #banner h2 {
      margin: 0; font-size: 32px; color: #00f0ff;
      text-shadow: 0 0 18px rgba(0, 240, 255, 0.85);
      letter-spacing: 3px;
    }
    #banner.overheat-alert h2 {
      color: #ff0055;
      font-size: 38px;
      text-shadow: 0 0 25px rgba(255, 0, 85, 0.95), 0 0 8px #ffffff;
    }
    #banner p {
      margin: 6px 0 0; font-size: 13px; color: #fff; letter-spacing: 2px;
    }
    @keyframes blink { 50% { opacity: 0.25; } }
  </style>
</head>
<body>
  <div id="glitch-frame"></div>
  <div id="status-corner"></div>

  <!-- Intro Top Bar: Bank & Wardrobe -->
  <div id="intro-top-bar">
    <div id="bank-box">PTS: <span id="bank-points">0</span></div>
    <button id="wardrobe-btn">WARDROBE</button>
  </div>

  <!-- Wardrobe Drawer -->
  <div id="wardrobe-panel">
    <div id="wardrobe-header">
      <span>CORE WARDROBE</span>
      <button id="close-wardrobe">DONE</button>
    </div>
    <div id="wardrobe-grid"></div>
  </div>

  <div id="intro-brand">
    <h1>OVERHEAT</h1>
    <p>READY TO IGNITE?</p>
  </div>

  <div id="level-corner" style="opacity: 0;">
    <div id="level-text">LEVEL 1/10</div>
    <div id="goal-text">GOAL: 2500</div>
    <div id="goal-bar-container"><div id="goal-bar"></div></div>
  </div>

  <div id="ui" style="opacity: 0;">
    <div id="ego-title">PULSE: BORED</div>
    <div id="score">0</div>
    <div id="mult-badge"></div>
    <div id="heat-label">CORE HEAT</div>
    <div id="heat-bar-container"><div id="heat-bar"></div></div>
  </div>

  <div id="banner">
    <h2 id="banner-title">LEVEL 1 CLEARED!</h2>
    <p id="banner-sub">ENTERING LEVEL 2...</p>
  </div>

  <div id="hint-box">
    <div id="hint">TOUCH & HOLD TO START</div>
    <div id="legend">
      <span class="leg-item"><i class="dot-cyan"></i>COOLANT</span>
      <span class="leg-item"><i class="dot-white"></i>GHOST SHIELD</span>
      <span class="leg-item"><i class="dot-green"></i>SCORE x2</span>
    </div>
  </div>

  <canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d', { alpha: false });
    const glitchFrame = document.getElementById('glitch-frame');
    const introTopBar = document.getElementById('intro-top-bar');
    const bankPointsEl = document.getElementById('bank-points');
    const wardrobeBtn = document.getElementById('wardrobe-btn');
    const wardrobePanel = document.getElementById('wardrobe-panel');
    const closeWardrobeBtn = document.getElementById('close-wardrobe');
    const wardrobeGrid = document.getElementById('wardrobe-grid');
    const introBrand = document.getElementById('intro-brand');
    const uiEl = document.getElementById('ui');
    const scoreEl = document.getElementById('score');
    const multBadge = document.getElementById('mult-badge');
    const egoTitle = document.getElementById('ego-title');
    const statusCorner = document.getElementById('status-corner');
    const levelCorner = document.getElementById('level-corner');
    const levelText = document.getElementById('level-text');
    const goalText = document.getElementById('goal-text');
    const goalBar = document.getElementById('goal-bar');
    const heatBar = document.getElementById('heat-bar');
    const heatContainer = document.getElementById('heat-bar-container');
    const hintBox = document.getElementById('hint-box');
    const hint = document.getElementById('hint');
    const banner = document.getElementById('banner');
    const bannerTitle = document.getElementById('banner-title');
    const bannerSub = document.getElementById('banner-sub');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;
    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const GEAR_CATALOG = [
      { id: 'shades', cat: 'eyewear', name: 'COOL SHADES', cost: 0 },
      { id: 'patch', cat: 'eyewear', name: 'EYE PATCH', cost: 500 },
      { id: 'visor', cat: 'eyewear', name: 'CYBER VISOR', cost: 1500 },
      { id: 'bowtie', cat: 'neck', name: 'RED BOWTIE', cost: 1000 },
      { id: 'tie', cat: 'neck', name: 'NEON TIE', cost: 2500 },
      { id: 'crown', cat: 'hat', name: 'PLASMA CROWN', cost: 4000 },
      { id: 'tophat', cat: 'hat', name: 'GENTLE HAT', cost: 6000 },
      { id: 'cape', cat: 'back', name: 'HERO CAPE', cost: 8000 },
      { id: 'katana', cat: 'back', name: 'LASER BLADE', cost: 12000 }
    ];

    let bankPoints = parseInt(localStorage.getItem('overheat_bank') || '0', 10);
    let unlockedGear = JSON.parse(localStorage.getItem('overheat_unlocked') || '["shades"]');
    let equippedGear = JSON.parse(localStorage.getItem('overheat_equipped') || '{"eyewear":"shades","neck":null,"hat":null,"back":null}');
    let wardrobeOpen = false;

    function saveWardrobeData() {
      localStorage.setItem('overheat_bank', bankPoints.toString());
      localStorage.setItem('overheat_unlocked', JSON.stringify(unlockedGear));
      localStorage.setItem('overheat_equipped', JSON.stringify(equippedGear));
      bankPointsEl.innerText = bankPoints;
    }

    function renderWardrobe() {
      bankPointsEl.innerText = bankPoints;
      wardrobeGrid.innerHTML = '';
      GEAR_CATALOG.forEach(item => {
        const isUnlocked = unlockedGear.includes(item.id);
        const isEquipped = equippedGear[item.cat] === item.id;
        const box = document.createElement('div');
        box.className = `gear-box ${isEquipped ? 'equipped' : ''} ${!isUnlocked ? 'locked' : ''}`;

        let statusLabel = '';
        if (isEquipped) statusLabel = 'EQUIPPED';
        else if (isUnlocked) statusLabel = 'EQUIP';
        else statusLabel = `${item.cost} PTS`;

        box.innerHTML = `
          <div class="gear-cat">${item.cat}</div>
          <div class="gear-name">${item.name}</div>
          <div class="gear-status">${statusLabel}</div>
        `;

        box.addEventListener('click', (e) => {
          e.stopPropagation();
          if (isUnlocked) {
            equippedGear[item.cat] = isEquipped ? null : item.id;
            saveWardrobeData();
            renderWardrobe();
          } else if (bankPoints >= item.cost) {
            bankPoints -= item.cost;
            unlockedGear.push(item.id);
            equippedGear[item.cat] = item.id;
            saveWardrobeData();
            renderWardrobe();
            spawnParticles(player.x, player.y, '#a855f7', 16);
          }
        });
        wardrobeGrid.appendChild(box);
      });
    }

    wardrobeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      wardrobeOpen = true;
      wardrobePanel.classList.add('open');
      hintBox.style.opacity = '0';
      renderWardrobe();
    });

    closeWardrobeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      wardrobeOpen = false;
      wardrobePanel.classList.remove('open');
      hintBox.style.opacity = '1';
    });

    let introState = 'intro';
    let turnProgress = 0;
    let overheatProgress = 0;
    let overheatStartPos = { x: width / 2, y: height * 0.72 };
    let blinkTimer = 0;
    let isBlinking = false;
    let lookTarget = { x: width / 2, y: height * 0.42 };

    const INTRO_RADIUS = 52;
    const GAME_RADIUS = 14;

    const MAX_LEVELS = 10;
    const LEVEL_10_BONUS_PTS = 2500;
    let currentLevel = 1;
    let levelStartScore = 0;
    let levelGoalPoints = 2500;
    let finishLineY = null;
    let levelTransition = false;

    let started = false;
    let isPressing = false;
    let score = 0;
    let lastBankedRunScore = 0;
    let heat = 10;
    let speed = 3;
    let laserY = height + 55;
    let shake = 0;
    let player = {
      x: width / 2,
      y: height * 0.42,
      radius: INTRO_RADIUS,
      targetX: width / 2
    };
    let obstacles = [];
    let items = [];
    let particles = [];
    let shockwaves = [];
    let floatingTexts = [];
    let frameCount = 0;

    let slipTimer = 0;
    let ghostTimer = 0;
    const GHOST_DURATION = 156;
    let glitchTimer = 0;
    let criticalSlowTimer = 0;

    let rayDistanceCounter = 0;
    let raysSpawnedCount = 0;
    let nextSpecialRay = 12;

    const EGO_LEVELS = [
      { min: 0, text: "PULSE: BORED", color: "#888" },
      { min: 1500, text: "PULSE: AWAKE", color: "#00f0ff" },
      { min: 5000, text: "PULSE: SWEATING", color: "#a855f7" },
      { min: 12000, text: "PULSE: INHUMAN", color: "#ec4899" },
      { min: 22000, text: "GOD OF CHAOS", color: "#ff0055" }
    ];

    function bankEarnedRunPoints() {
      const earned = Math.max(0, Math.floor(score) - lastBankedRunScore);
      if (earned > 0) {
        bankPoints += earned;
        lastBankedRunScore = Math.floor(score);
        saveWardrobeData();
      }
    }

    function getPointsNeededForLevel(lvl) {
      return 2500 + (lvl - 1) * 1000;
    }

    function getCumulativeGoal(lvl) {
      let total = 0;
      for (let i = 1; i <= lvl; i++) {
        total += getPointsNeededForLevel(i);
      }
      return total;
    }

    function hasActiveSpecialPerk() {
      return ghostTimer > 0 || glitchTimer > 0;
    }

    function hasSpecialItemOnScreen() {
      return items.some(it => it.type === 'ghost' || it.type === 'glitch');
    }

    function updateLevelUI(animatePop = false) {
      levelGoalPoints = getPointsNeededForLevel(currentLevel);
      const exactTarget = getCumulativeGoal(currentLevel);
      levelText.innerText = `LEVEL ${currentLevel}/${MAX_LEVELS}`;
      goalText.innerText = `GOAL: ${exactTarget}`;
      if (animatePop) {
        levelCorner.classList.add('level-up-pop');
        setTimeout(() => levelCorner.classList.remove('level-up-pop'), 350);
      }
    }

    function addFloatingText(x, y, text, color) {
      floatingTexts.push({
        x: Math.max(85, Math.min(width - 85, x)),
        y: y,
        text: text,
        color: color,
        life: 1.0
      });
    }

    function showBanner(title, sub, duration = 1400, isOverheat = false) {
      bannerTitle.innerText = title;
      bannerSub.innerText = sub;
      if (isOverheat) {
        banner.classList.add('overheat-alert');
      } else {
        banner.classList.remove('overheat-alert');
      }
      banner.classList.add('show');
      setTimeout(() => {
        banner.classList.remove('show');
        banner.classList.remove('overheat-alert');
      }, duration);
    }

    function clearModifiers() {
      slipTimer = 0;
      ghostTimer = 0;
      glitchTimer = 0;
      criticalSlowTimer = 0;
      glitchFrame.classList.remove('active');
      statusCorner.innerHTML = '';
      multBadge.innerText = '';
    }

    function initLevel(keepScore = false) {
      if (!keepScore) {
        score = levelStartScore;
        lastBankedRunScore = levelStartScore;
      }
      heat = 10;
      speed = 3;
      laserY = height + 55;
      player.x = width / 2;
      player.targetX = width / 2;
      player.y = height * 0.72;
      player.radius = GAME_RADIUS;
      turnProgress = 1;
      introState = 'playing';
      obstacles = [];
      items = [];
      particles = [];
      floatingTexts = [];
      clearModifiers();
      rayDistanceCounter = 180;
      raysSpawnedCount = 0;
      nextSpecialRay = 10 + Math.floor(Math.random() * 5);
      finishLineY = null;
      levelTransition = false;
      heatContainer.style.borderColor = '#444';
      heatBar.style.width = `${heat}%`;
      updateLevelUI(keepScore);
    }

    function resetCurrentLevel() {
      bankEarnedRunPoints();
      started = false;
      isPressing = false;
      initLevel(false);
      hintBox.style.display = 'block';
      hint.innerText = `RETRY LEVEL ${currentLevel} (+PTS SAVED)`;
    }

    function resetToFreshCampaignIntro() {
      currentLevel = 1;
      levelStartScore = 0;
      score = 0;
      lastBankedRunScore = 0;
      started = false;
      isPressing = false;
      levelTransition = false;
      finishLineY = null;
      obstacles = [];
      items = [];
      particles = [];
      floatingTexts = [];
      clearModifiers();
      heat = 10;
      heatBar.style.width = '10%';
      scoreEl.innerText = '0';
      goalBar.style.width = '0%';
      egoTitle.innerText = 'PULSE: BORED';
      egoTitle.style.color = '#888';
      updateLevelUI(false);

      introState = 'intro';
      turnProgress = 0;
      player.x = width / 2;
      player.targetX = width / 2;
      player.y = height * 0.42;
      player.radius = INTRO_RADIUS;

      uiEl.style.opacity = '0';
      levelCorner.style.opacity = '0';
      introTopBar.style.opacity = '1';
      introTopBar.style.pointerEvents = 'auto';
      introBrand.style.opacity = '1';
      introBrand.style.transform = 'translateY(0)';
      hintBox.style.display = 'block';
      hintBox.style.opacity = '1';
      hint.innerText = 'TOUCH & HOLD TO START';
    }

    function triggerOverheatSequence() {
      bankEarnedRunPoints();
      started = false;
      isPressing = false;
      clearModifiers();
      obstacles = [];
      items = [];
      heat = 100;
      heatBar.style.width = '100%';
      introState = 'overheating';
      overheatProgress = 0;
      overheatStartPos = { x: player.x, y: player.y };
      shake = 12;
      spawnParticles(player.x, player.y, '#ff0055', 16);
    }

    function detonateOverheat() {
      introState = 'exploded';
      shake = 32;
      shockwaves.push({ x: player.x, y: player.y, r: 20, alpha: 1, color: '#ff0055' });
      shockwaves.push({ x: player.x, y: player.y, r: 8, alpha: 0.95, color: '#f97316' });
      shockwaves.push({ x: player.x, y: player.y, r: 2, alpha: 0.9, color: '#ffffff' });
      spawnParticles(player.x, player.y, '#ff0055', 45);
      spawnParticles(player.x, player.y, '#f97316', 35);
      spawnParticles(player.x, player.y, '#ffffff', 20);

      showBanner('OVERHEATED!', 'CORE MELTDOWN', 1650, true);

      setTimeout(() => {
        initLevel(false);
        hintBox.style.display = 'block';
        hint.innerText = `RETRY LEVEL ${currentLevel} (+PTS SAVED)`;
      }, 1750);
    }

    function completeLevel() {
      levelTransition = true;
      obstacles = [];
      items = [];
      heat = 0;
      heatBar.style.width = '0%';
      clearModifiers();
      score = getCumulativeGoal(currentLevel);
      scoreEl.innerText = score;
      bankEarnedRunPoints();
      shockwaves.push({ x: player.x, y: player.y, r: 15, alpha: 1, color: '#00f0ff' });
      spawnParticles(player.x, player.y, '#00f0ff', 25);

      if (currentLevel < MAX_LEVELS) {
        const completed = currentLevel;
        currentLevel++;
        levelStartScore = score;
        showBanner(`LEVEL ${completed} CLEARED!`, `ENTERING LEVEL ${currentLevel}`, 1400, false);
        setTimeout(() => {
          initLevel(true);
        }, 1150);
      } else {
        bankPoints += LEVEL_10_BONUS_PTS;
        saveWardrobeData();
        showBanner(
          "ALL 10 LEVELS CLEARED!",
          `+${LEVEL_10_BONUS_PTS} PTS BONUS · NEW GAME UNLOCKED`,
          3000,
          false
        );
        setTimeout(() => {
          resetToFreshCampaignIntro();
        }, 3200);
      }
    }

    function triggerIntroTurnAround(x, y) {
      introState = 'turning';
      turnProgress = 0;
      introTopBar.style.opacity = '0';
      introTopBar.style.pointerEvents = 'none';
      introBrand.style.opacity = '0';
      introBrand.style.transform = 'translateY(-15px)';
      hintBox.style.display = 'none';
      uiEl.style.opacity = '1';
      levelCorner.style.opacity = '1';
      started = true;
      isPressing = true;
      player.targetX = x;
      rayDistanceCounter = 60;
      spawnParticles(player.x, player.y, '#00f0ff', 14);
    }

    function onDown(x, y) {
      if (wardrobeOpen || introState === 'overheating' || introState === 'exploded' || levelTransition) return;
      lookTarget.x = x;
      lookTarget.y = y;

      if (introState === 'intro') {
        triggerIntroTurnAround(x, y);
        return;
      }

      if (!started) {
        started = true;
        hintBox.style.display = 'none';
      }
      isPressing = true;
      player.targetX = x;
    }

    function onMove(x, y) {
      lookTarget.x = x;
      lookTarget.y = y;
      if (isPressing && !wardrobeOpen && introState === 'playing') player.targetX = x;
    }

    function onUp() {
      isPressing = false;
    }

    window.addEventListener('touchstart', e => {
      if (e.target.closest('#wardrobe-panel') || e.target.closest('#wardrobe-btn')) return;
      onDown(e.touches[0].clientX, e.touches[0].clientY);
    });
    window.addEventListener('touchmove', e => {
      if (e.target.closest('#wardrobe-panel')) return;
      onMove(e.touches[0].clientX, e.touches[0].clientY);
    });
    window.addEventListener('touchend', onUp);
    window.addEventListener('mousedown', e => {
      if (e.target.closest('#wardrobe-panel') || e.target.closest('#wardrobe-btn')) return;
      onDown(e.clientX, e.clientY);
    });
    window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
    window.addEventListener('mouseup', onUp);

    function spawnParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 11,
          vy: (Math.random() - 0.5) * 11,
          life: 1,
          color
        });
      }
    }

    function getRandomFreeX(rayX, rayW, safeWidth) {
      for (let attempt = 0; attempt < 10; attempt++) {
        let candidate = 38 + Math.random() * (safeWidth - 76);
        if (candidate < rayX - 25 || candidate > rayX + rayW + 25) {
          return candidate;
        }
      }
      return rayX > safeWidth / 2 ? 45 : safeWidth - 45;
    }

    function createLightningBolt(difficulty) {
      if (finishLineY !== null) return;

      const safeWidth = Math.max(width, 300);
      const w = Math.min(60 + Math.random() * (40 + difficulty * 75), safeWidth * 0.60);
      const x = Math.random() * (safeWidth - w);

      obstacles.push({
        x: x,
        y: -20,
        w: w,
        h: 10,
        nearMissed: false,
        phasedThrough: false,
        isViolet: Math.random() > 0.45
      });

      raysSpawnedCount++;

      const spawnInterval = heat > 65 ? 1 : 2;
      if (raysSpawnedCount % spawnInterval === 0) {
        items.push({
          type: 'nitrogen',
          x: getRandomFreeX(x, w, safeWidth),
          y: -95 - (Math.random() * 35),
          radius: 13,
          phase: Math.random() * 6
        });
      } else if (
        raysSpawnedCount >= nextSpecialRay &&
        !hasActiveSpecialPerk() &&
        !hasSpecialItemOnScreen()
      ) {
        nextSpecialRay = raysSpawnedCount + 16 + Math.floor(Math.random() * 7);
        let specialType = Math.random() > 0.48 ? 'ghost' : 'glitch';
        items.push({
          type: specialType,
          x: getRandomFreeX(x, w, safeWidth),
          y: -90 - (Math.random() * 40),
          radius: 12,
          phase: Math.random() * 6
        });
      }
    }

    function updateStatusBadges() {
      let html = '';
      if (ghostTimer > 0) {
        html += `<span class="badge" style="color:#fff; border:1px solid #fff;">GHOST SHIELD ${(ghostTimer / 60).toFixed(1)}s</span>`;
      } else if (glitchTimer > 0) {
        html += `<span class="badge" style="color:#22c55e; border:1px solid #22c55e;">SCORE x2 ${(glitchTimer / 60).toFixed(1)}s</span>`;
      }
      if (slipTimer > 0) {
        html += `<span class="badge" style="color:#00f0ff; border:1px solid #00f0ff;">SLIPPERY ${(slipTimer / 60).toFixed(1)}s</span>`;
      }
      statusCorner.innerHTML = html;

      if (criticalSlowTimer > 0) {
        multBadge.innerText = `CRITICAL REFLEX x2`;
        multBadge.style.color = '#ff0055';
      } else if (glitchTimer > 0) {
        multBadge.innerText = `DOUBLE SCORE ACTIVE x2`;
        multBadge.style.color = '#22c55e';
      } else {
        multBadge.innerText = '';
      }
    }

    function update() {
      frameCount++;

      blinkTimer++;
      if (!isBlinking && blinkTimer > 150 && Math.random() < 0.04) {
        isBlinking = true;
        blinkTimer = 0;
      } else if (isBlinking && blinkTimer > 9) {
        isBlinking = false;
        blinkTimer = 0;
      }

      for (let i = shockwaves.length - 1; i >= 0; i--) {
        let sw = shockwaves[i];
        sw.r += 11;
        sw.alpha -= 0.028;
        if (sw.alpha <= 0) shockwaves.splice(i, 1);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.042;
        if (p.life <= 0) particles.splice(i, 1);
      }

      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        let ft = floatingTexts[i];
        ft.y -= 1.2;
        ft.life -= 0.022;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
      }

      if (introState === 'intro') {
        const idleY = wardrobeOpen ? height * 0.30 : height * 0.42;
        player.x = width / 2;
        player.y += ((idleY + Math.sin(frameCount * 0.05) * 6) - player.y) * 0.15;
        player.radius = INTRO_RADIUS;
        turnProgress = 0;
        return;
      }

      if (introState === 'turning') {
        turnProgress = Math.min(turnProgress + 0.038, 1);
        const ease = 1 - Math.pow(1 - turnProgress, 3);
        const startY = height * 0.42;
        const targetY = height * 0.72;
        player.y = startY + (targetY - startY) * ease;
        player.radius = INTRO_RADIUS + (GAME_RADIUS - INTRO_RADIUS) * ease;

        if (turnProgress >= 1) {
          introState = 'playing';
          player.y = targetY;
          player.radius = GAME_RADIUS;
        }
      }

      if (introState === 'overheating') {
        overheatProgress = Math.min(overheatProgress + 0.026, 1);
        const ease = 1 - Math.pow(1 - overheatProgress, 3);

        player.x = overheatStartPos.x + ((width / 2) - overheatStartPos.x) * ease;
        player.y = overheatStartPos.y + ((height * 0.45) - overheatStartPos.y) * ease;
        player.radius = GAME_RADIUS + ((INTRO_RADIUS * 1.12) - GAME_RADIUS) * ease;
        turnProgress = 1 - ease;

        shake = 6 + overheatProgress * 14;
        if (Math.random() < 0.65) {
          spawnParticles(
            player.x + (Math.random() - 0.5) * player.radius,
            player.y + (Math.random() - 0.5) * player.radius,
            Math.random() > 0.4 ? '#ff0055' : '#f97316',
            2
          );
        }

        if (overheatProgress >= 1) {
          detonateOverheat();
        }
        return;
      }

      if (introState === 'exploded' || levelTransition) {
        return;
      }

      if (!started) return;

      if (slipTimer > 0) slipTimer--;
      if (criticalSlowTimer > 0) criticalSlowTimer--;
      if (ghostTimer > 0) ghostTimer--;
      if (glitchTimer > 0) {
        glitchTimer--;
        if (glitchTimer === 0) glitchFrame.classList.remove('active');
      }
      updateStatusBadges();

      let difficulty = (currentLevel - 1) / 9;
      let maxSpeed = 8.8 + (difficulty * 4.8);
      let heatRate = 0.21 + (difficulty * 0.12);

      let timeScale = criticalSlowTimer > 0 ? 0.55 : 1.0;
      let scoreMult = (criticalSlowTimer > 0 ? 2 : 1) * (glitchTimer > 0 ? 2 : 1);

      if (isPressing) {
        speed = Math.min(speed + 0.11, maxSpeed);
        heat += heatRate * timeScale;
        score += (speed * 0.12) * scoreMult * timeScale;
        laserY = Math.min(laserY + 1.7 * timeScale, height + 55);
        if (Math.random() < 0.3) {
          const trailColor = glitchTimer > 0 ? '#22c55e' : (heat > 75 ? '#ff0055' : '#a855f7');
          spawnParticles(player.x, player.y + player.radius * 0.7, trailColor, 1);
        }
      } else {
        speed = Math.max(speed - 0.16, 2.2);
        heat = Math.max(heat - 0.78, 0);
        laserY -= (1.35 + difficulty * 1.0) * 1.15 * timeScale;
      }

      let effectiveSpeed = speed * timeScale;

      if (heat > 75) {
        heatContainer.style.borderColor = frameCount % 10 < 5 ? '#ff0055' : '#ffffff';
        if (Math.random() < 0.35) spawnParticles(player.x, player.y, '#ff0055', 1);
      } else {
        heatContainer.style.borderColor = '#444';
      }

      let lerp = slipTimer > 0 ? 0.065 : 0.28;
      player.x += (player.targetX - player.x) * lerp;

      if (heat >= 100) {
        triggerOverheatSequence();
        return;
      }

      if (laserY <= player.y + player.radius) {
        shake = 22;
        resetCurrentLevel();
        return;
      }

      const pointsInLevel = score - levelStartScore;
      const progress = Math.min((pointsInLevel / levelGoalPoints) * 100, 100);
      scoreEl.innerText = Math.floor(score);
      goalBar.style.width = `${progress}%`;
      heatBar.style.width = `${heat}%`;

      for (let i = EGO_LEVELS.length - 1; i >= 0; i--) {
        if (score >= EGO_LEVELS[i].min) {
          egoTitle.innerText = EGO_LEVELS[i].text;
          egoTitle.style.color = EGO_LEVELS[i].color;
          break;
        }
      }

      if (progress >= 97 && finishLineY === null) {
        finishLineY = -30;
      }

      if (finishLineY !== null) {
        finishLineY += effectiveSpeed;
        if (finishLineY >= player.y) {
          completeLevel();
          return;
        }
      }

      rayDistanceCounter += effectiveSpeed;
      const targetSpacing = Math.max(140, 240 - (difficulty * 95));
      if (rayDistanceCounter >= targetSpacing) {
        rayDistanceCounter = 0;
        createLightningBolt(difficulty);
      }

      const rForgive = GAME_RADIUS - 3;
      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.y += effectiveSpeed;

        const isTouchingRay = (
          player.x + rForgive > obs.x && player.x - rForgive < obs.x + obs.w &&
          player.y + rForgive > obs.y - 4 && player.y - rForgive < obs.y + 4
        );

        if (isTouchingRay && introState === 'playing') {
          if (ghostTimer > 0) {
            if (!obs.phasedThrough) {
              obs.phasedThrough = true;
              const bonus = 150 * scoreMult;
              score += bonus;
              addFloatingText(player.x, player.y - 25, `PHASED +${bonus}!`, '#ffffff');
              spawnParticles(player.x, player.y, '#ffffff', 14);
            }
          } else {
            shake = 22;
            resetCurrentLevel();
            return;
          }
        }

        if (!obs.nearMissed && !obs.phasedThrough && obs.y > player.y && player.x + 40 > obs.x && player.x - 40 < obs.x + obs.w) {
          obs.nearMissed = true;
          const isCriticalMoment = (heat >= 70) || ((laserY - player.y) < 135);

          if (isCriticalMoment) {
            criticalSlowTimer = 40;
            const bonus = 80 * scoreMult;
            score += bonus;
            addFloatingText(player.x, player.y - 22, `CRITICAL DODGE +${bonus}`, '#ff0055');
            shake = 9;
          } else {
            const bonus = 40 * scoreMult;
            score += bonus;
            addFloatingText(player.x, player.y - 20, `NEAR MISS +${bonus}`, '#00f0ff');
            shake = 5;
          }
          spawnParticles(player.x, player.y, '#00f0ff', 10);
        }

        if (obs.y > height + 40) obstacles.splice(i, 1);
      }

      for (let i = items.length - 1; i >= 0; i--) {
        let it = items[i];
        it.y += effectiveSpeed;
        let dist = Math.hypot(player.x - it.x, player.y - it.y);

        if (dist < 72 && dist >= 52) {
          it.x += (player.x - it.x) * 0.35;
          it.y += (player.y - it.y) * 0.35;
          dist = Math.hypot(player.x - it.x, player.y - it.y);
        }

        if (dist < 52) {
          if (it.type === 'nitrogen') {
            heat = Math.max(0, heat - 52);
            slipTimer = 120;
            score += 50 * scoreMult;
            addFloatingText(player.x, player.y - 20, 'COOLANT -52% (SLIPPERY)', '#00f0ff');
            spawnParticles(player.x, player.y, '#00f0ff', 14);
            items.splice(i, 1);
          } else if (it.type === 'ghost') {
            glitchTimer = 0;
            glitchFrame.classList.remove('active');
            ghostTimer = GHOST_DURATION;
            score += 75 * scoreMult;
            addFloatingText(player.x, player.y - 20, 'GHOST SHIELD: PASS RAYS!', '#ffffff');
            spawnParticles(player.x, player.y, '#ffffff', 16);
            items = items.filter(other => other.type === 'nitrogen');
            nextSpecialRay = raysSpawnedCount + 16 + Math.floor(Math.random() * 7);
            break;
          } else if (it.type === 'glitch') {
            ghostTimer = 0;
            glitchTimer = 240;
            glitchFrame.classList.add('active');
            score += 75 * scoreMult;
            addFloatingText(player.x, player.y - 20, 'DOUBLE SCORE x2!', '#22c55e');
            shake = 10;
            spawnParticles(player.x, player.y, '#22c55e', 16);
            items = items.filter(other => other.type === 'nitrogen');
            nextSpecialRay = raysSpawnedCount + 16 + Math.floor(Math.random() * 7);
            break;
          }
          continue;
        }
        if (it.y > height + 40) items.splice(i, 1);
      }
    }

    function drawLightning(obs) {
      const color = obs.isViolet ? '#a855f7' : '#38bdf8';
      const segments = Math.max(5, Math.floor(obs.w / 16));
      const stepX = obs.w / segments;

      const pts = [{ x: obs.x, y: obs.y }];
      for (let s = 1; s < segments; s++) {
        pts.push({
          x: obs.x + (s * stepX),
          y: obs.y + (Math.random() - 0.5) * 14
        });
      }
      pts.push({ x: obs.x + obs.w, y: obs.y });

      ctx.save();
      ctx.lineCap = 'butt';
      ctx.lineJoin = 'miter';

      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.strokeStyle = color;
      ctx.globalAlpha = 0.35;
      ctx.lineWidth = 8;
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.globalAlpha = 1;
      ctx.lineWidth = 3.5;
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.3;
      ctx.stroke();

      ctx.restore();
    }

    function drawItems() {
      items.forEach(it => {
        const pulse = Math.sin(frameCount * 0.14 + it.phase);
        const rot = frameCount * 0.04 + it.phase;
        ctx.save();
        ctx.translate(it.x, it.y);

        if (it.type === 'nitrogen') {
          ctx.strokeStyle = 'rgba(0, 240, 255, 0.85)';
          ctx.lineWidth = 1.4;
          for (let i = 0; i < 2; i++) {
            ctx.save();
            ctx.rotate(rot + (i * Math.PI / 2));
            ctx.scale(1, 0.36);
            ctx.beginPath();
            ctx.arc(0, 0, it.radius * 1.15, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          }
          ctx.beginPath();
          ctx.arc(0, 0, 4.5 + pulse * 1.4, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
        } else if (it.type === 'ghost') {
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 0, it.radius + pulse * 2, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(0, 0, 4, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
          ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,0.75)';
          ctx.font = 'bold 9px Courier New';
          ctx.textAlign = 'center';
          ctx.fillText('GHOST', 0, it.radius + 13);
        } else if (it.type === 'glitch') {
          ctx.save();
          ctx.rotate(rot * 1.5);
          ctx.strokeStyle = '#22c55e';
          ctx.lineWidth = 2.2;
          const s = it.radius + pulse * 2;
          ctx.strokeRect(-s / 2, -s / 2, s, s);
          ctx.fillStyle = '#22c55e';
          ctx.fillRect(-3, -3, 6, 6);
          ctx.restore();
          ctx.fillStyle = 'rgba(34,197,94,0.9)';
          ctx.font = 'bold 9px Courier New';
          ctx.textAlign = 'center';
          ctx.fillText('x2', 0, it.radius + 13);
        }

        ctx.restore();
      });
    }

    function drawOrbitingElectrons(r) {
      const isOverheating = introState === 'overheating';
      const orbitConfigs = [
        { tilt: 0.45, speed: isOverheating ? 0.24 : 0.065, color: isOverheating ? '#ff0055' : '#00f0ff', offset: 0 },
        { tilt: -0.45, speed: isOverheating ? -0.22 : -0.055, color: isOverheating ? '#f97316' : '#a855f7', offset: Math.PI }
      ];

      orbitConfigs.forEach(cfg => {
        ctx.save();
        ctx.rotate(cfg.tilt);

        const rx = r * 1.62;
        const ry = r * 0.52;

        ctx.strokeStyle = cfg.color;
        ctx.globalAlpha = (introState === 'intro' || isOverheating) ? 0.3 : 0.18;
        ctx.lineWidth = (introState === 'intro' || isOverheating) ? 1.5 : 1;
        ctx.beginPath();
        ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
        ctx.stroke();

        const angle = frameCount * cfg.speed + cfg.offset;
        const ex = Math.cos(angle) * rx;
        const ey = Math.sin(angle) * ry;

        ctx.globalAlpha = 1;
        ctx.fillStyle = cfg.color;
        ctx.beginPath();
        ctx.arc(ex, ey, (introState === 'intro' || isOverheating) ? 4.2 : 2.3, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(ex, ey, (introState === 'intro' || isOverheating) ? 1.8 : 1.0, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      });
    }

    function drawEquippedGear(r, isFrontFacing, faceSquash, yawOffset) {
      if (equippedGear.back === 'cape') {
        ctx.save();
        const wave = Math.sin(frameCount * 0.12) * (r * 0.08);
        ctx.fillStyle = '#e11d48';
        ctx.beginPath();
        ctx.moveTo(-r * 0.65, r * 0.1);
        ctx.lineTo(r * 0.65, r * 0.1);
        ctx.lineTo(r * 0.95 + wave, r * 1.25);
        ctx.lineTo(-r * 0.95 + wave, r * 1.25);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      } else if (equippedGear.back === 'katana') {
        ctx.save();
        ctx.rotate(-0.65);
        ctx.fillStyle = '#a855f7';
        ctx.fillRect(-r * 0.12, -r * 1.45, r * 0.24, r * 0.45);
        ctx.fillStyle = '#00f0ff';
        ctx.fillRect(-r * 0.06, -r * 1.0, r * 0.12, r * 2.35);
        ctx.restore();
      }

      if (equippedGear.hat === 'crown') {
        ctx.save();
        ctx.translate(0, -r * 0.92);
        ctx.fillStyle = '#facc15';
        ctx.strokeStyle = '#ca8a04';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-r * 0.42, 0);
        ctx.lineTo(-r * 0.48, -r * 0.38);
        ctx.lineTo(-r * 0.18, -r * 0.18);
        ctx.lineTo(0, -r * 0.46);
        ctx.lineTo(r * 0.18, -r * 0.18);
        ctx.lineTo(r * 0.48, -r * 0.38);
        ctx.lineTo(r * 0.42, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      } else if (equippedGear.hat === 'tophat') {
        ctx.save();
        ctx.translate(0, -r * 0.88);
        ctx.fillStyle = '#1e1b4b';
        ctx.strokeStyle = '#a855f7';
        ctx.lineWidth = 1.5;
        ctx.fillRect(-r * 0.65, -r * 0.08, r * 1.3, r * 0.12);
        ctx.strokeRect(-r * 0.65, -r * 0.08, r * 1.3, r * 0.12);
        ctx.fillRect(-r * 0.42, -r * 0.65, r * 0.84, r * 0.58);
        ctx.strokeRect(-r * 0.42, -r * 0.65, r * 0.84, r * 0.58);
        ctx.fillStyle = '#00f0ff';
        ctx.fillRect(-r * 0.42, -r * 0.2, r * 0.84, r * 0.1);
        ctx.restore();
      }

      if (isFrontFacing && equippedGear.neck) {
        ctx.save();
        ctx.translate(yawOffset * 0.85, r * 0.78);
        ctx.scale(Math.max(0.15, faceSquash), 1);
        if (equippedGear.neck === 'bowtie') {
          ctx.fillStyle = '#ef4444';
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(-r * 0.32, -r * 0.16);
          ctx.lineTo(-r * 0.32, r * 0.16);
          ctx.closePath();
          ctx.moveTo(0, 0);
          ctx.lineTo(r * 0.32, -r * 0.16);
          ctx.lineTo(r * 0.32, r * 0.16);
          ctx.closePath();
          ctx.fill();
          ctx.beginPath();
          ctx.arc(0, 0, r * 0.09, 0, Math.PI * 2);
          ctx.fillStyle = '#b91c1c';
          ctx.fill();
        } else if (equippedGear.neck === 'tie') {
          ctx.fillStyle = '#00f0ff';
          ctx.beginPath();
          ctx.moveTo(-r * 0.1, 0);
          ctx.lineTo(r * 0.1, 0);
          ctx.lineTo(r * 0.16, r * 0.48);
          ctx.lineTo(0, r * 0.62);
          ctx.lineTo(-r * 0.16, r * 0.48);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }
    }

    function drawEyewearOverlay(r, eyeOffsetX, eyeOffsetY, eyeRadius) {
      const ew = equippedGear.eyewear;
      if (!ew) return;

      if (ew === 'shades') {
        ctx.save();
        ctx.fillStyle = '#09090b';
        ctx.strokeStyle = introState === 'overheating' ? '#facc15' : '#00f0ff';
        ctx.lineWidth = Math.max(1.8, r * 0.045);

        const lensW = eyeRadius * 2.25;
        const lensH = eyeRadius * 1.45;

        ctx.beginPath();
        ctx.moveTo(-r * 0.12, eyeOffsetY - lensH * 0.25);
        ctx.lineTo(r * 0.12, eyeOffsetY - lensH * 0.25);
        ctx.stroke();

        [-1, 1].forEach(side => {
          const lx = side * eyeOffsetX - lensW / 2;
          const ly = eyeOffsetY - lensH * 0.45;
          ctx.fillRect(lx, ly, lensW, lensH);
          ctx.strokeRect(lx, ly, lensW, lensH);

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
          ctx.lineWidth = Math.max(1.5, r * 0.035);
          ctx.beginPath();
          ctx.moveTo(lx + lensW * 0.22, ly + lensH * 0.8);
          ctx.lineTo(lx + lensW * 0.55, ly + lensH * 0.2);
          ctx.stroke();
          ctx.strokeStyle = introState === 'overheating' ? '#facc15' : '#00f0ff';
          ctx.lineWidth = Math.max(1.8, r * 0.045);
        });
        ctx.restore();
      } else if (ew === 'patch') {
        ctx.save();
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = Math.max(2, r * 0.05);
        ctx.beginPath();
        ctx.moveTo(-r * 0.85, -r * 0.45);
        ctx.lineTo(r * 0.85, r * 0.18);
        ctx.stroke();

        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(eyeOffsetX, eyeOffsetY, eyeRadius * 1.18, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#a855f7';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();
      } else if (ew === 'visor') {
        ctx.save();
        const vw = r * 1.48;
        const vh = eyeRadius * 1.25;
        ctx.fillStyle = 'rgba(236, 72, 153, 0.85)';
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.8;
        ctx.fillRect(-vw / 2, eyeOffsetY - vh / 2, vw, vh);
        ctx.strokeRect(-vw / 2, eyeOffsetY - vh / 2, vw, vh);
        ctx.restore();
      }
    }

    function drawPlayerCharacter() {
      if (introState === 'exploded') return;

      const r = player.radius;
      const isOverheating = introState === 'overheating';

      ctx.save();
      ctx.translate(player.x, player.y);

      let scaleX = 1;
      let scaleY = 1;
      if (introState === 'intro') {
        const breathe = Math.sin(frameCount * 0.07) * 0.035;
        scaleX = 1 + breathe;
        scaleY = 1 - breathe;
      } else if (introState === 'turning') {
        scaleX = 1 - Math.sin(turnProgress * Math.PI) * 0.14;
        scaleY = 1 + Math.sin(turnProgress * Math.PI) * 0.14;
      } else if (isOverheating) {
        const pulse = Math.sin(frameCount * 0.9) * (0.06 + overheatProgress * 0.08);
        scaleX = 1 + pulse;
        scaleY = 1 - pulse * 0.8;
      }
      ctx.scale(scaleX, scaleY);

      drawOrbitingElectrons(r);

      if (ghostTimer > 0 && introState === 'playing') {
        const ratio = ghostTimer / GHOST_DURATION;
        ctx.beginPath();
        ctx.arc(0, 0, r + 8, -Math.PI / 2, (-Math.PI / 2) + (Math.PI * 2 * ratio));
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.globalAlpha = 0.55;
      }

      if (introState === 'intro') {
        ctx.beginPath();
        ctx.arc(0, 0, r + 14 + Math.sin(frameCount * 0.06) * 4, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 240, 255, 0.08)';
        ctx.fill();
      } else if (isOverheating) {
        ctx.beginPath();
        ctx.arc(0, 0, r + 18 + Math.sin(frameCount * 0.8) * 6, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 0, 85, 0.28)';
        ctx.fill();
      }

      const turnAngle = turnProgress * Math.PI;
      const isFrontFacing = introState === 'intro' ||
                            (introState === 'turning' && turnProgress < 0.55) ||
                            (isOverheating && turnProgress < 0.55);
      const yawOffset = Math.sin(turnAngle) * r * 1.15;
      const faceSquash = Math.cos(turnAngle);

      if (isFrontFacing && (equippedGear.back === 'cape' || equippedGear.back === 'katana')) {
        drawEquippedGear(r, isFrontFacing, faceSquash, yawOffset);
      }

      const bodyGrad = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
      if (isOverheating) {
        bodyGrad.addColorStop(0, '#fde047');
        bodyGrad.addColorStop(0.45, '#ff0055');
        bodyGrad.addColorStop(1, '#991b1b');
      } else {
        const baseColor = introState !== 'playing'
          ? '#ffffff'
          : (glitchTimer > 0 ? '#22c55e' : (ghostTimer > 0 ? '#ffffff' : (slipTimer > 0 ? '#00f0ff' : (heat > 75 ? '#ff0055' : '#ffffff'))));
        bodyGrad.addColorStop(0, '#ffffff');
        bodyGrad.addColorStop(0.72, baseColor);
        bodyGrad.addColorStop(1, introState !== 'playing' ? '#cbd5e1' : baseColor);
      }

      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fillStyle = bodyGrad;
      ctx.fill();

      if (isFrontFacing) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.96, 0, Math.PI * 2);
        ctx.clip();

        ctx.translate(yawOffset, 0);
        ctx.scale(Math.max(0.05, faceSquash), 1);

        const dx = isOverheating ? (Math.random() - 0.5) * 3 : Math.max(-1, Math.min(1, (lookTarget.x - player.x) / 160));
        const dy = isOverheating ? (Math.random() - 0.5) * 3 : Math.max(-1, Math.min(1, (lookTarget.y - player.y) / 160));

        const eyeOffsetX = r * 0.34;
        const eyeOffsetY = -r * 0.08;
        const eyeRadius = r * 0.22;

        [-1, 1].forEach(side => {
          const ex = side * eyeOffsetX;
          const ey = eyeOffsetY;

          if (isBlinking && introState === 'intro') {
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = Math.max(2, r * 0.055);
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.arc(ex, ey + eyeRadius * 0.15, eyeRadius * 0.75, Math.PI * 1.15, Math.PI * 1.85);
            ctx.stroke();
          } else {
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(ex + dx * 3, ey + dy * 3, eyeRadius, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = isOverheating ? '#facc15' : '#00f0ff';
            ctx.lineWidth = Math.max(1.2, r * 0.03);
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(ex + dx * 3 - eyeRadius * 0.32, ey + dy * 3 - eyeRadius * 0.32, eyeRadius * 0.36, 0, Math.PI * 2);
            ctx.fill();
          }
        });

        drawEyewearOverlay(r, eyeOffsetX + dx * 2, eyeOffsetY + dy * 2, eyeRadius);

        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = Math.max(2, r * 0.05);
        ctx.lineCap = 'round';

        if (isOverheating) {
          ctx.fillStyle = '#450a0a';
          ctx.beginPath();
          ctx.ellipse(0, r * 0.32, r * 0.15, r * 0.19, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        } else if (introState === 'turning') {
          ctx.fillStyle = '#fb7185';
          ctx.beginPath();
          ctx.arc(0, r * 0.28, r * 0.11, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        } else {
          ctx.beginPath();
          ctx.arc(0, r * 0.20, r * 0.15, Math.PI * 0.15, Math.PI * 0.85);
          ctx.stroke();
        }

        ctx.restore();
      } else if ((introState === 'turning' && turnProgress >= 0.55) || (isOverheating && turnProgress >= 0.55)) {
        const backAlpha = (turnProgress - 0.55) / 0.45;
        ctx.strokeStyle = isOverheating
          ? `rgba(255, 255, 255, ${0.55 * (1 - backAlpha)})`
          : `rgba(0, 240, 255, ${0.45 * (1 - backAlpha)})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, r * 0.65, -Math.PI * 0.75, -Math.PI * 0.25);
        ctx.stroke();
      }

      drawEquippedGear(r, isFrontFacing, faceSquash, yawOffset);
      if (!isFrontFacing && (equippedGear.back === 'cape' || equippedGear.back === 'katana')) {
        drawEquippedGear(r, false, faceSquash, yawOffset);
      }

      ctx.restore();
    }

    function draw() {
      ctx.save();
      if (shake > 0) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
        shake *= 0.85;
      }

      ctx.fillStyle = 'rgba(9, 9, 11, 0.38)';
      ctx.fillRect(0, 0, width, height);

      shockwaves.forEach(sw => {
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
        ctx.strokeStyle = sw.color;
        ctx.globalAlpha = sw.alpha;
        ctx.lineWidth = 4;
        ctx.stroke();
        ctx.globalAlpha = 1;
      });

      if (finishLineY !== null) {
        ctx.fillStyle = 'rgba(0, 240, 255, 0.25)';
        ctx.fillRect(0, finishLineY - 10, width, 20);
        ctx.fillStyle = '#00f0ff';
        ctx.fillRect(0, finishLineY - 2, width, 4);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText(`GOAL LEVEL ${currentLevel}`, width / 2, finishLineY - 8);
      }

      drawItems();
      obstacles.forEach(obs => drawLightning(obs));

      drawPlayerCharacter();

      floatingTexts.forEach(ft => {
        ctx.save();
        ctx.globalAlpha = ft.life;
        ctx.fillStyle = ft.color;
        ctx.font = 'bold 11px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
      });

      if (introState === 'playing') {
        ctx.fillStyle = 'rgba(255, 0, 85, 0.85)';
        ctx.fillRect(0, laserY, width, height - laserY + 100);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, laserY, width, 2);
      }

      particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 4, 4);
      });
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    saveWardrobeData();
    updateLevelUI();
    loop();
  </script>
</body>
